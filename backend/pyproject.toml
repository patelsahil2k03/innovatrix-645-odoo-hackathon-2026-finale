[project]
name = "urban-furniture-accounting"
version = "0.1.0"
description = "Urban Furniture double-entry accounting backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi~=0.141",
    "sqlalchemy~=2.0.52",
    "alembic>=1.19",
    "pydantic>=2.9",
    "pyjwt",
    "bcrypt",
    "sse-starlette~=3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
