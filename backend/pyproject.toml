[project]
name = "app"
version = "0.1.0"
description = "Hackathon boilerplate API — Team Innovatrix"
requires-python = ">=3.13"
dependencies = [
    "fastapi~=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy~=2.0.52",
    "alembic>=1.19",
    "pydantic-settings>=2.15",
    "sse-starlette~=3.4",
    "bcrypt>=5.0",
    "pyjwt>=2.13",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
]

# psycopg is OPTIONAL: only needed if DATABASE_URL points at PostgreSQL.
# SQLite (the default) needs nothing extra. Install with: uv sync --extra postgres
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3"]

[dependency-groups]
dev = ["pytest>=9.1", "httpx>=0.28"]

[project.scripts]
app-seed = "app.seed.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
